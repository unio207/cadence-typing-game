<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    #f7f4ec;
    --ink:      #17171a;
    --ink-done: #c2bdb0;
    --mute:     #a3a098;
    --rule:     #e6e2d7;
    --red:      #b4412f;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(.33, 1, .68, 1);
    --size: 30px;
    /* where the caret sits across the stage. draft C moves it right: its threat
       comes from behind, so it needs room to show the edge. */
    --caret-x: 34%;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--paper); color: var(--ink);
    font-family: var(--mono); font-weight: 400;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .screen { display: none; height: 100%; }
  .screen.is-active { display: block; }

  .label { display: block; font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }

  /* ================= run ================= */

  #screen-run { position: relative; height: 100%; }

  .hud { position: absolute; top: 34px; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 1180px; display: flex; align-items: baseline; gap: 40px;
    padding: 0 clamp(20px, 4vw, 48px); }
  .hud .value { display: block; font-size: 27px; letter-spacing: -.02em; line-height: 1; }
  .hud .value .of { color: var(--ink-done); font-size: 17px; }
  .hud .spacer { margin-left: auto; }
  .hud .chapter { text-align: right; }
  .hud .chapter .name { display: block; font-size: 12.5px; font-weight: 500; line-height: 1; }

  #strikes { display: flex; gap: 7px; justify-content: flex-end; height: 11px; align-items: center; }
  #strikes i { width: 11px; height: 11px; border-radius: 50% 40% 55% 45%; box-shadow: inset 0 0 0 1px var(--rule); }
  #strikes i.spent { background: var(--red); box-shadow: none; }

  /* text */
  #stage { position: absolute; top: 50%; left: 50%; width: 100%; max-width: 1180px;
    height: 190px; transform: translate(-50%, -50%); }
  #track { position: absolute; top: 46px; left: 0; right: 0; height: 58px; overflow: hidden; }
  #line, #caret-line {
    position: absolute; top: 50%; white-space: pre;
    font-size: var(--size); line-height: 1; letter-spacing: -.01em;
    will-change: transform;
  }
  #line { left: var(--caret-x); transform: translateY(-50%); }
  #line span { transition: none; }
  #line .done { color: var(--ink-done); }
  #line .err  { color: var(--red); opacity: .55 !important; }
  #line .miss { color: var(--red); opacity: .16 !important; }


  #caret {
    position: absolute; top: 46px; left: var(--caret-x);
    height: 58px; width: 1ch; overflow: hidden;
    border-radius: 2px; background: var(--ink);
    font-size: var(--size);
    will-change: transform;
  }
  #caret-line { left: 0; color: var(--paper); transform: translateY(-50%); }


  /* the edge - draft C */
  #edge { position: absolute; top: 38px; width: 1px; height: 74px; background: var(--red); display: none; }
  #edge::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 64px;
    background: linear-gradient(90deg, var(--paper), transparent); }

  /* branch lines - draft C */
  .branch { position: absolute; white-space: pre; font-size: 23px; line-height: 1;
    letter-spacing: -.01em; color: var(--ink); display: none; }
  #branch-safe   { top: 0; }
  #branch-greedy { top: 152px; }
  .branch .tag { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
  #branch-greedy .tag { color: var(--red); }

  #rail { position: absolute; left: 0; top: 120px; width: 100%; height: 22px; display: block; }

  .bar { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 1180px; height: 3px; background: var(--rule); }
  #bar-fill  { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--ink); }
  #bar-notch { position: absolute; bottom: -5px; width: 1px; height: 13px; background: var(--red); }
  #bar-notch::after { content: 'demand'; position: absolute; top: 15px; left: -19px;
    font-size: 7.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }

  /* ================= sheets ================= */

  .sheet { height: 100%; display: flex; flex-direction: column; justify-content: center;
    padding: 0 clamp(20px, 5vw, 64px); max-width: 1040px; margin: 0 auto; }
  .wordmark { font-size: 13px; letter-spacing: .34em; text-transform: uppercase; font-weight: 500; }
  .wordmark s { text-decoration: none; color: #cfc9ba; }

  .drafts { margin-top: 38px; }
  .draft-row { display: flex; align-items: baseline; gap: 18px; padding: 16px 0;
    border-top: 1px solid var(--rule); cursor: pointer; }
  .draft-row:last-child { border-bottom: 1px solid var(--rule); }
  .draft-row .k { font-size: 10px; letter-spacing: .2em; color: var(--mute); width: 14px; }
  .draft-row .n { font-size: 25px; letter-spacing: -.02em; width: 190px; font-weight: 500; }
  .draft-row .d { font-size: 12.5px; color: #7d7a72; flex: 1; padding-right: 20px; }
  .draft-row .b { font-size: 12.5px; color: var(--ink); text-align: right; white-space: nowrap; }
  .draft-row .b em { font-style: normal; color: var(--mute); }
  .draft-row:hover .n, .draft-row.sel .n { color: var(--red); }

  .hint { margin-top: 40px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
  .hint b { color: var(--ink); font-weight: 500; }
  .hint span { margin-right: 26px; }

  .big { font-size: clamp(54px, 9vw, 92px); letter-spacing: -.045em; line-height: 1; margin: 16px 0 2px; }
  .sub { font-size: 30px; letter-spacing: -.03em; }
  .flag { color: var(--red); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin-top: 10px; }
  .stats { display: flex; gap: clamp(22px, 5vw, 54px); margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--rule); }
  .stats .v { font-size: 27px; letter-spacing: -.02em; }
  .stats .v s { text-decoration: none; font-size: 14px; color: var(--mute); margin-left: 2px; }
  #page-print { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--rule);
    font-size: 16px; line-height: 2.0; max-height: 170px; overflow: hidden; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<section id="screen-title" class="screen is-active">
  <div class="sheet">
    <div class="wordmark">cadence<s> &middot; three drafts</s></div>
    <div class="drafts" id="draft-list"></div>
    <div class="hint"><span><b>1 2</b> choose</span><span><b>any letter</b> begin</span></div>
  </div>
</section>

<section id="screen-run" class="screen">
  <div class="hud">
    <span><i class="label">score</i><b class="value" id="hud-score">0</b></span>
    <span><i class="label">wpm</i><b class="value"><span id="hud-wpm">0</span><span class="of"> / <span id="hud-demand">40</span></span></b></span>
    <span><i class="label">rhythm</i><b class="value" id="hud-rhythm">50</b></span>
    <span class="spacer"></span>
    <span class="chapter"><i class="label" id="hud-chapter-label">chapter one</i><b class="name" id="hud-chapter">open field</b></span>
    <span class="chapter"><i class="label" id="strike-label">strikes</i><div id="strikes"><i></i><i></i><i></i></div></span>
  </div>

  <div id="stage">
    <div class="branch" id="branch-safe"></div>
    <div id="track"><div id="line"></div></div>
    <div id="caret"><div id="caret-line"></div></div>
    <div id="edge"></div>
    <canvas id="rail"></canvas>
    <div class="branch" id="branch-greedy"></div>
  </div>

  <div class="bar"><div id="bar-fill"></div><div id="bar-notch"></div></div>
</section>

<section id="screen-result" class="screen">
  <div class="sheet" id="result-sheet"></div>
</section>

<script src="src/keymap.js"></script>
<script src="src/words.js"></script>
<script src="src/generator.js"></script>
<script src="src/metrics.js"></script>
<script src="src/survival.js"></script>
<script src="src/draft-a.js"></script>
<script src="src/draft-c.js"></script>
<script src="src/rail.js"></script>
<script src="src/render.js"></script>
<script src="src/screens.js"></script>
<script src="src/shell.js"></script>
</body>
</html>
