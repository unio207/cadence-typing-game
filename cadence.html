<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
// Resolve the theme before the first paint, so a dark-mode player never sees a
// frame of cream. These are the same two lines as cadenceScreens.resolveTheme,
// deliberately duplicated: src/screens.js loads at the end of <body>, which is
// far too late to decide what colour the page is.
(function () {
  try {
    var t = localStorage.getItem('cadence.theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<style>
  :root {
    --paper:    #f7f4ec;
    --ink:      #17171a;
    --ink-done: #c2bdb0;
    --mute:     #a3a098;
    --rule:     #e6e2d7;
    --red:      #b4412f;
    --faint:    #cfc9ba;   /* the struck-through half of the wordmark */
    --body:     #7d7a72;   /* running prose: the draft blurbs */
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(.33, 1, .68, 1);
    --size: 30px;
    /* where the caret sits across the stage. draft C moves it right: its threat
       comes from behind, so it needs room to show the edge. */
    --caret-x: 34%;
  }

  /* Warm dark: the paper is dimmed, not negated. Never pure black - #19150f still
     has the cream's hue in it, so the page reads as lamplight on the same stock
     rather than as a different material. --ink-done and --rule have to be lifted
     off the surface rather than dropped toward it, since on dark the "receded"
     direction is up. --red keeps its hue and gains lightness: #b4412f against
     #19150f is barely a colour, and red has to stay the loudest thing on screen
     because it means an error, a strike, the demand notch or a new record. */
  :root[data-theme="dark"] {
    --paper:    #19150f;
    --ink:      #f0e7d4;
    --ink-done: #544d41;
    --mute:     #8b8373;
    --rule:     #2c261c;
    --red:      #d4594a;
    --faint:    #463f32;
    --body:     #9c9381;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--paper); color: var(--ink);
    font-family: var(--mono); font-weight: 400;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .screen { display: none; height: 100%; }
  .screen.is-active { display: block; }

  .label { display: block; font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }

  /* ================= run ================= */

  #screen-run { position: relative; height: 100%; }

  .hud { position: absolute; top: 34px; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 1180px; display: flex; align-items: baseline; gap: 40px;
    padding: 0 clamp(20px, 4vw, 48px); }
  .hud .value { display: block; font-size: 27px; letter-spacing: -.02em; line-height: 1; }
  .hud .value .of { color: var(--ink-done); font-size: 17px; }
  .hud .spacer { margin-left: auto; }
  .hud .chapter { text-align: right; }
  .hud .chapter .name { display: block; font-size: 12.5px; font-weight: 500; line-height: 1; }

  #strikes { display: flex; gap: 7px; justify-content: flex-end; height: 11px; align-items: center; }
  #strikes i { width: 11px; height: 11px; border-radius: 50% 40% 55% 45%; box-shadow: inset 0 0 0 1px var(--rule); }
  #strikes i.spent { background: var(--red); box-shadow: none; }

  /* text */
  #stage { position: absolute; top: 50%; left: 50%; width: 100%; max-width: 1180px;
    height: 190px; transform: translate(-50%, -50%); }
  #track { position: absolute; top: 46px; left: 0; right: 0; height: 58px; overflow: hidden; }
  #line, #caret-line {
    position: absolute; top: 50%; white-space: pre;
    font-size: var(--size); line-height: 1; letter-spacing: -.01em;
    will-change: transform;
  }
  #line { left: var(--caret-x); transform: translateY(-50%); }
  #line span { transition: none; }
  #line .done { color: var(--ink-done); }
  #line .err  { color: var(--red); opacity: .55 !important; }
  #line .miss { color: var(--red); opacity: .16 !important; }


  #caret {
    position: absolute; top: 46px; left: var(--caret-x);
    height: 58px; width: 1ch; overflow: hidden;
    border-radius: 2px; background: var(--ink);
    font-size: var(--size);
    will-change: transform;
  }
  #caret-line { left: 0; color: var(--paper); transform: translateY(-50%); }


  /* the edge - draft C */
  #edge { position: absolute; top: 38px; width: 1px; height: 74px; background: var(--red); display: none; }
  #edge::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 64px;
    background: linear-gradient(90deg, var(--paper), transparent); }

  /* branch lines - draft C */
  .branch { position: absolute; white-space: pre; font-size: 23px; line-height: 1;
    letter-spacing: -.01em; color: var(--ink); display: none; }
  #branch-safe   { top: 0; }
  #branch-greedy { top: 152px; }
  .branch .tag { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
  #branch-greedy .tag { color: var(--red); }

  #rail { position: absolute; left: 0; top: 120px; width: 100%; height: 22px; display: block; }

  .bar { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 1180px; height: 3px; background: var(--rule); }
  #bar-fill  { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--ink); }
  #bar-notch { position: absolute; bottom: -5px; width: 1px; height: 13px; background: var(--red); }
  #bar-notch::after { content: 'demand'; position: absolute; top: 15px; left: -19px;
    font-size: 7.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }

  /* ================= sheets ================= */

  .sheet { height: 100%; display: flex; flex-direction: column; justify-content: center;
    padding: 0 clamp(20px, 5vw, 64px); max-width: 1040px; margin: 0 auto; }
  .wordmark { font-size: 13px; letter-spacing: .34em; text-transform: uppercase; font-weight: 500; }
  .wordmark s { text-decoration: none; color: var(--faint); }

  .drafts { margin-top: 38px; }
  .draft-row { display: flex; align-items: baseline; gap: 18px; padding: 16px 0;
    border-top: 1px solid var(--rule); cursor: pointer; }
  .draft-row:last-child { border-bottom: 1px solid var(--rule); }
  .draft-row .k { font-size: 10px; letter-spacing: .2em; color: var(--mute); width: 14px; }
  .draft-row .n { font-size: 25px; letter-spacing: -.02em; width: 190px; font-weight: 500; }
  .draft-row .d { font-size: 12.5px; color: var(--body); flex: 1; padding-right: 20px; }
  .draft-row .b { font-size: 12.5px; color: var(--ink); text-align: right; white-space: nowrap; }
  .draft-row .b em { font-style: normal; color: var(--mute); }
  .draft-row:hover .n, .draft-row.sel .n { color: var(--red); }

  /* the goal ladder. one rung per level, cleared rungs inked solid - the ladder is
     the progression, so it has to read as one object rather than as a form. */
  .goal { margin-top: 30px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .goal .label { font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--mute); font-style: normal; width: 104px; flex: none; }
  .rung { font-size: 15px; letter-spacing: -.02em; color: var(--ink-done); cursor: pointer;
    font-variant-numeric: tabular-nums; }
  .rung.cleared { color: var(--ink); }
  .rung.cleared::after { content: '\00b7'; color: var(--red); margin-left: 2px; }
  .rung.sel { color: var(--red); font-weight: 500; }
  .goal .note { font-size: 11.5px; color: var(--body); margin-left: auto; }

  .hint { margin-top: 40px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
  .hint b { color: var(--ink); font-weight: 500; }
  .hint span { margin-right: 26px; }

  .big { font-size: clamp(54px, 9vw, 92px); letter-spacing: -.045em; line-height: 1; margin: 16px 0 2px; }
  .sub { font-size: 30px; letter-spacing: -.03em; }
  .flag { color: var(--red); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin-top: 10px; }
  .stats { display: flex; gap: clamp(22px, 5vw, 54px); margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--rule); }
  .stats .v { font-size: 27px; letter-spacing: -.02em; }
  .stats .v s { text-decoration: none; font-size: 14px; color: var(--mute); margin-left: 2px; }
  #page-print { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--rule);
    font-size: 16px; line-height: 2.0; max-height: 170px; overflow: hidden; }

  /* the expand control: a hint, not a button. it lives in the hint row and is
     styled by .hint, so it inherits the 10px uppercase letter-spaced voice. */
  .hint .expand { cursor: pointer; user-select: none; }
  .hint .expand:hover { color: var(--ink); }

  /* everything past the headline number. collapsed is the default state; the
     reveal is one of the two house curves and does not run under reduced motion. */
  .more { display: none; }
  #result-sheet.is-open .more { display: block; animation: reveal .3s var(--ease) both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  /* theme control. fixed, so it is reachable from the title screen, mid-run and
     on the result screen without any screen needing to know about it. */
  #theme-toggle {
    position: fixed; left: clamp(20px, 5vw, 64px); bottom: 15px; z-index: 5;
    font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--mute); cursor: pointer; user-select: none;
  }
  #theme-toggle b { color: var(--ink); font-weight: 500; }
  #theme-toggle:hover { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<script>
/* src/keymap.js */
(function (root) {
  'use strict';

  const ROWS = { top: 'qwertyuiop', home: 'asdfghjkl', bottom: 'zxcvbnm' };

  // 0-3 left pinky..index, 5 thumb, 6-9 right index..pinky
  const FINGERS = {
    q: 0, a: 0, z: 0,
    w: 1, s: 1, x: 1,
    e: 2, d: 2, c: 2,
    r: 3, f: 3, v: 3, t: 3, g: 3, b: 3,
    y: 6, h: 6, n: 6, u: 6, j: 6, m: 6,
    i: 7, k: 7,
    o: 8, l: 8,
    p: 9
  };

  function keyInfo(ch) {
    if (ch === ' ') return { hand: 'T', row: 'space', finger: 5 };
    const finger = FINGERS[ch];
    if (finger === undefined) return null;
    let row = null;
    for (const name of Object.keys(ROWS)) {
      if (ROWS[name].indexOf(ch) !== -1) { row = name; break; }
    }
    return { hand: finger <= 3 ? 'L' : 'R', row: row, finger: finger };
  }

  function tagWord(word) {
    const infos = [];
    for (const ch of word) {
      const info = keyInfo(ch);
      if (!info) throw new Error('word "' + word + '" contains unmappable "' + ch + '"');
      infos.push(info);
    }

    const hands = infos.map(i => i.hand).join('');
    const rows = infos.map(i => i.row[0]).join('');
    const fingers = infos.map(i => i.finger);

    let home = 0, top = 0, alt = 0, run = 1, maxRun = 1, sameFinger = 0;
    for (let i = 0; i < infos.length; i++) {
      if (infos[i].row === 'home') home++;
      if (infos[i].row === 'top') top++;
      if (i > 0) {
        if (infos[i].hand !== infos[i - 1].hand) { alt++; run = 1; }
        else { run++; if (run > maxRun) maxRun = run; }
        if (infos[i].finger === infos[i - 1].finger && word[i] !== word[i - 1]) sameFinger++;
      }
    }

    const transitions = Math.max(1, infos.length - 1);
    const left = hands.split('').filter(h => h === 'L').length;
    const right = hands.length - left;

    return {
      word: word,
      len: word.length,
      hands: hands,
      rows: rows,
      fingers: fingers,
      homeFrac: home / word.length,
      topFrac: top / word.length,
      altFrac: infos.length > 1 ? alt / transitions : 0,
      maxSameHandRun: maxRun,
      sameFingerPairs: sameFinger,
      hand: right > left ? 'R' : 'L'
    };
  }

  const api = { keyInfo, tagWord, ROWS, FINGERS };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.cadence = Object.assign(root.cadence || {}, api);
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

  'use strict';

  const RHYTHM_WINDOW = 16;
  const RHYTHM_MIN_SAMPLES = 8;

  //

  // so ten even intervals among sixteen hold the median deviation at exactly
  // zero and a badly lurching 10/6 split scores a perfect 100. Instead we drop
  // the single largest deviation - which is what buys forgiveness for one
  // hiccup, explicitly rather than as an accident of the estimator - and take
  // the mean of the rest.

    const devs = xs.map(d => Math.abs(d - m)).sort((a, b) => a - b);
    devs.pop();                                     // forgive the worst single slip

  // Adaptive beats both pure strategies by 8-12%, so the junction is a real
  // decision. It is a SHALLOW one: the adaptive curve is nearly flat across
  // thresholds, so no particular policy is much better than another. A human has
  // information this sweep does not - it judges only the gap, never how awkward
  // the two lines actually look - so the ceiling is probably higher in practice.
  const TUNING = { greedyPayout: 2.0, edgeGreedyMult: 1.25 };

  // Taking your hands off the keys has to cost something promptly. At the demand's
  // ordinary pace the edge needs ~8s to cross a full lead and ~5s per reprieve, so
  // a full stop took 24s to end a run. The edge surges while you are idle instead:
  // the page catching up fast when you are not moving is the obvious reading.
  const IDLE_SURGE_AFTER_MS = 1200;
  const EDGE_IDLE_MULT = 4;

  // Why the edge quickens rather than the hard words simply being slower: in
  // character coordinates a longer branch costs nothing, because the edge has to
  // traverse those extra characters too - the gap closes at (yourCps - edgeCps)
  // regardless of path length. And measured against the typist model in
  // tools/typist.js, the denser greedy text is only ~5% slower to type, which a
  // 1.6x payout dwarfs. Without an explicit cost the greedy line is strictly
  // better and the choice is fake.

  const WARMUP_RATIO = 1.2;   // comfortably legible while the speed tracker fills

  const META = {
    id: 'c',
    name: 'branches',
    blurb: 'two valid lines. the hard one pays double. stay ahead of the edge.',
    pressure: 'a chaser'
  };

  function cps(demandWpm) { return (demandWpm * 5) / 60; }

  // The least run-up a junction may have, in characters. The run-up IS the segment
  // you are typing when the junction opens, and in the short-word chapters a
  // three-word segment is only 11 characters - under a second at 150 wpm, which is
  // not enough time to read two lines and choose. Short segments are padded with
  // plain words (no payout, no fork) until the run-up is at least this long.
  const MIN_RUNUP = 18;

  function appendSegment(run, text, mult) {
    for (let i = 0; i < text.length; i++) run.payoutAt.push(mult);
    run.text += text;
  }

  // Opens the NEXT junction, a whole segment ahead of the cursor.
  //
  // This is the fix for the flaw the player reported: "it ruins the rhythm since
  // you have to stop and look at each sentence since they show up only after you
  // complete the previous one." newBranch() used to be called from onKey the
  // instant the cursor reached segmentEnd, so the two candidate lines appeared
  // under your fingers with zero lead - you had to stop, read both, and choose.
  // The choice is meant to be one you have ALREADY made by the time your fingers
  // arrive, which means the lines have to be on screen while you finish the
  // current segment. So: the junction is opened as soon as the previous one is
  // resolved, which gives a lead of one full segment (18-22 characters, 1.4-2.4s
  // at 110-200 wpm) and leaves both lines on screen continuously.
  //
  // The safe line is also appended to the page immediately, as a PROVISIONAL
  // continuation. Without that the page simply ends at the junction while you are
  // still typing toward it - a hole in the line and a dead stop for the eye, which
  // is the stall this change exists to remove. Reaching for the greedy line
  // rewrites the page from the junction onward (see resolve), and since nothing
  // past the junction has been typed yet, nothing typed is ever rewritten.
  function newBranch(run) {
    const pair = run.gen.branchPair(run.chapterIndex);
    const safeText = pair.safe.join(' ') + ' ';
    run.branch = {
      safeText: safeText,
      greedyText: pair.greedy.join(' ') + ' ',
      payout: TUNING.greedyPayout,

  // The cursor has arrived at the junction and one key has decided it.
  function resolve(run, which) {
    const b = run.branch;
    b.committed = which;
    if (which === 'greedy') {

      // exactly at b.at, so this never touches a character already struck.
      run.text = run.text.slice(0, b.at);
      run.payoutAt.length = b.at;
      appendSegment(run, b.greedyText, TUNING.greedyPayout);
      run.greedyTaken++;
    } else {
      run.safeTaken++;
    }
    run.segmentGreedy = which === 'greedy';
    run.segmentStart = b.at;
    while (run.text.length - b.at < MIN_RUNUP) {
      appendSegment(run, run.gen.words(run.chapterIndex, 1)[0] + ' ', 1);
    }
    run.segmentEnd = run.text.length;
    newBranch(run);                 // open the next one immediately: read-ahead
  }

  // true when the next keystroke is the one that commits. Callers that choose a
  // line (the shell's replay, tools/balance.js, tools/sweep-c.js) ask this rather
  // than inspecting the branch, because "the junction is open" and "the cursor is
  // standing on it" are now two different things - which is the whole point.
  function atJunction(run) {
    return run.branch !== null && run.branch.committed === null && run.cursor === run.branch.at;
  }

  function createRun(seed) {
    const run = {
      draft: 'c', seed: seed, gen: g.createGenerator(seed),
      text: '', cursor: 0, marks: [], rhythmAt: [], payoutAt: [],
      branch: null, segmentStart: 0, segmentEnd: 0, segmentGreedy: false,
      safeTaken: 0, greedyTaken: 0,
      edge: -START_LEAD, touches: 0, closestGap: Infinity,
      combo: 0, maxCombo: 0, score: 0, correct: 0, total: 0,
      v: 0, peakV: 0, ratio: 1, rhythm: 50, chapterIndex: 0,
      startedAt: null, lastKeyAt: null, nowMs: 0, intervals: [],
      ended: false, endReason: null,
      demand: s.createDemand(), speed: m.createSpeed()
    };
    // open on a plain committed segment so the FIRST junction has read-ahead too,
    // rather than greeting the player with a choice on keystroke one.
    const opening = run.gen.words(0, 3).join(' ') + ' ';
    appendSegment(run, opening, 1);
    run.segmentEnd = run.text.length;
    newBranch(run);
    return run;
  }

  function endRun(run, reason) { run.ended = true; run.endReason = reason; }

  function onKey(run, key, nowMs) {
    if (run.ended) return { correct: false, ended: true, chose: null };
    if (run.startedAt === null) run.startedAt = nowMs;
    run.nowMs = nowMs;

    let chose = null;
    let correct;

    if (atJunction(run)) {
      // one keystroke decides which line you are on. a wrong key here is an
      // ordinary error on the line you were already on, not a third outcome.
      if (key === run.branch.greedyText[0]) { resolve(run, 'greedy'); chose = 'greedy'; correct = true; }
      else { correct = key === run.text[run.cursor]; resolve(run, 'safe'); chose = 'safe'; }
    } else {
      correct = key === run.text[run.cursor];
    }

    if (run.lastKeyAt !== null) {
      run.intervals.push(nowMs - run.lastKeyAt);
      if (run.intervals.length > 64) run.intervals.shift();
    }
    run.lastKeyAt = nowMs;

    m.pushKey(run.speed, nowMs);
    run.v = m.wpmAt(run.speed, nowMs);
    if (run.v > run.peakV) run.peakV = run.v;
    run.rhythm = m.rhythmOf(run.intervals);

    run.total++;
    run.marks[run.cursor] = correct ? 'ok' : 'err';
    run.rhythmAt[run.cursor] = run.rhythm;
    const payout = run.payoutAt[run.cursor] || 1;
    run.cursor++;

    if (correct) {
      run.correct++;
      run.combo++;
      if (run.combo > run.maxCombo) run.maxCombo = run.combo;
      run.score += m.pointsFor(run.v, run.rhythm, run.combo) * payout;
    } else {
      run.combo = 0;
    }

    return { correct: correct, ended: run.ended, chose: chose };
  }

  function tick(run, nowMs, dtSeconds) {
    if (run.ended || run.startedAt === null) return;
    run.nowMs = nowMs;

    run.v = m.wpmAt(run.speed, nowMs);

    // Until the speed tracker is warm, rolling wpm is meaningless - it reads near
    // zero however fast you are going. Pin the ratio somewhere comfortable and
    // keep the cold-start zeros out of the demand ratchet.
    if (!m.isWarm(run.speed)) {
      run.ratio = WARMUP_RATIO;
      s.stepDemand(run.demand, dtSeconds);
    } else {
      s.sampleSpeed(run.demand, run.v, nowMs);
      s.stepDemand(run.demand, dtSeconds);
      run.ratio = run.demand.value > 0 ? run.v / run.demand.value : 0;
    }

    const next = g.chapterAt(run.demand.value);
    if (next > run.chapterIndex) run.chapterIndex = next;

    const idle = run.lastKeyAt !== null && (nowMs - run.lastKeyAt) > IDLE_SURGE_AFTER_MS;
    let edgeRate = cps(run.demand.value) * (run.segmentGreedy ? TUNING.edgeGreedyMult : 1);
    if (idle) edgeRate *= EDGE_IDLE_MULT;
    run.edge += edgeRate * dtSeconds;

    if (run.cursor - run.edge > MAX_GAP) run.edge = run.cursor - MAX_GAP;

    const gap = run.cursor - run.edge;
    if (gap < run.closestGap) run.closestGap = gap;
    if (gap <= 0) {
      run.touches++;
      run.edge = run.cursor - REPRIEVE;
      if (run.touches >= MAX_TOUCHES) endRun(run, 'caught');
    }

  }

  function gapOf(run) { return run.cursor - run.edge; }
  function inkAhead() { return 1; }
  function endLabel() { return 'the edge caught you'; }

  const api = {
    draftC: {
      META, createRun, onKey, tick, inkAhead, endLabel, gapOf, atJunction,
      MAX_TOUCHES, START_LEAD, MAX_GAP, TUNING, EDGE_IDLE_MULT,

/* src/rail.js */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------------------
  // The rhythm rail. One mark per keystroke on a leftward-scrolling time axis.
  //
  // Three treatments were considered; this is the third.
  //
  //   1. REJECTED - the original comb: uniform 1px x 13px ticks centred on a
  //      hairline baseline, whole-rail opacity driven by rhythm. Spacing was the
  //      only signal, and spacing alone is the hardest thing in the world to read
  //      at a glance: at 180 wpm the ticks sit ~13px apart and the eye sees an
  //      even grey texture whether or not the run was even. The baseline ran
  //      through the ticks' middles, so it crossed every mark and read as noise.
  //
  //   2. REJECTED - an interval plot: a filled step/area shape whose height is
  //      each interval's duration. Legible, but it stops being one-mark-per-
  //      keystroke and becomes a chart, and a chart of a noisy signal is a
  //      decorative squiggle. Also it never rests: even perfect typing draws a
  //      wobbling band, which contradicts "playing well makes the page calm".
  //
  //   3. CHOSEN - deviation marks hanging from a ruled line. The rule sits at the
  //      top of the rail, so it reads as an underline of the text above it, and
  //      every mark hangs down from it. A mark's LENGTH encodes how far that
  //      keystroke's interval deviated from the local median - the same window
  //      the rhythm metric scores (metrics.js, 16 intervals). An even run draws a
  //      row of identical short stubs, a flat dotted edge under the line. A
  //      lurching run draws spikes exactly where the lurches were. Unevenness
  //      becomes a silhouette you can read in one glance instead of a spacing
  //      judgement, and the shared top edge gives every length the same baseline
  //      to be compared against, which centring would not.
  //
  //      Marks are 2px so they hold at 180 wpm, and fade with age toward the left
  //      so the newest few hundred milliseconds are the darkest thing in the rail
  //      and old marks leave without popping out of existence. A gentle global
  //      rhythm term remains, so a steady run reads darker overall - but rhythm's
  //      real expression is now the shape, not the ink.
  //
  // No red here: the rail never signals an error. Red stays reserved.
  // ---------------------------------------------------------------------------

  // 200 px/s. At 0.09 the marks sat ~6px apart at 160 wpm and read as a texture
  // rather than a cadence; this shows roughly the last six seconds, legibly.
  const PX_PER_MS = 0.2;
  const CAPACITY = 500;
  const WINDOW = 16;          // same interval window the rhythm metric uses
  const CLAMP_MS = 600;       // same per-interval clamp as the rhythm metric
  const STUB = 4;             // a keystroke bang on the local median
  const SPIKE = 17;           // a keystroke a full median late (or early)
  // |d/m - 1| at which a mark reaches full length. 0.35 is not a free parameter:
  // it is the same cv the rhythm metric saturates at (metrics.js clamps cv/0.35),
  // so a run that scores rhythm 0 is exactly a run whose rail is all spikes. At
  // the 0.9 first tried, +-15% jitter - which scores rhythm 74 - drew a mean mark
  // of 5.0px against the 4px stub, i.e. nothing you could see.
  const SPREAD = 0.35;

  function median(sorted) {
    const n = sorted.length;
    if (!n) return 0;
    const h = n >> 1;
    return n % 2 ? sorted[h] : (sorted[h - 1] + sorted[h]) / 2;
  }

  function createRail(canvas) {
    const ctx = canvas.getContext('2d');
    const marks = [];           // { t, dev } - dev in 0..1, computed once at mark()
    const intervals = [];       // trailing WINDOW intervals, for the local median
    let w = 0, h = 0, ink = '#17171a', rule = '#e6e2d7';

    function readColours() {
      const st = getComputedStyle(document.documentElement);
      ink = (st.getPropertyValue('--ink') || '#17171a').trim();
      rule = (st.getPropertyValue('--rule') || '#e6e2d7').trim();
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      w = rect.width; h = rect.height;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      readColours();
    }

    // Deviation is resolved here, not in draw(): it needs a median over a 16-wide
    // window, and doing that for ~400 visible marks every frame would be 6400
    // comparisons a frame for a number that can never change once written.
    function mark(nowMs) {
      let dev = 0;
      if (marks.length) {
        const d = Math.min(CLAMP_MS, Math.max(0, nowMs - marks[marks.length - 1].t));
        intervals.push(d);
        if (intervals.length > WINDOW) intervals.shift();
        // Below four intervals there is no meaningful "local median" yet, so the
        // opening keystrokes draw as even rather than as wild spikes.
        if (intervals.length >= 4) {
          const m = median(intervals.slice().sort((a, b) => a - b));
          if (m > 0) dev = Math.min(1, Math.abs(d / m - 1) / SPREAD);
        }
      }
      marks.push({ t: nowMs, dev: dev });
      if (marks.length > CAPACITY) marks.shift();
    }

    // Reading canvas.clientWidth every frame to spot a size change forces a
    // synchronous layout, and it lands immediately after the renderer has dirtied
    // its span window - the worst possible moment. A ResizeObserver delivers the
    // same information only when the size actually changes, including the moment
    // a canvas created inside a display:none section first gets a size, which is
    // the case that made the rail silently never paint at all.
    let dirty = true;
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(function () { dirty = true; }).observe(canvas);
    }

    function draw(nowMs, rhythm) {
      if (dirty || !w) {
        resize();
        dirty = false;
        if (typeof ResizeObserver !== 'function' && Math.abs(canvas.clientWidth - w) > 0.5) {
          resize();   // no observer: fall back to measuring each frame
        }
      }
      if (!w) return;
      ctx.clearRect(0, 0, w, h);

      // The ruled line the marks hang from. It is the shared edge that makes the
      // lengths comparable, which is why it is at the top and not through them.
      ctx.globalAlpha = 1;
      ctx.fillStyle = rule;
      ctx.fillRect(0, 0, w, 1);

      const steady = 0.55 + 0.45 * Math.max(0, Math.min(100, rhythm || 0)) / 100;
      const top = 2;
      ctx.fillStyle = ink;
      for (let i = marks.length - 1; i >= 0; i--) {
        const x = w - (nowMs - marks[i].t) * PX_PER_MS;
        if (x < -2) break;
        if (x > w) continue;
        const age = Math.pow(Math.max(0, x) / w, 0.8);      // newest = darkest
        ctx.globalAlpha = steady * (0.15 + 0.85 * age);
        const len = STUB + (SPIKE - STUB) * marks[i].dev;
        ctx.fillRect(Math.round(x) - 1, top, 2, Math.min(len, h - top));
      }
      ctx.globalAlpha = 1;
    }

    function reset() { marks.length = 0; intervals.length = 0; }

    resize();
    return {
      resize: resize, mark: mark, draw: draw, reset: reset,
      readColours: readColours,
      // test seam: the drawn shape is entirely a function of these
      _marks: marks
    };
  }

  const api = { createRail };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.cadence = Object.assign(root.cadence || {}, api);
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* src/render.js */
(function (root) {
  'use strict';

  const WINDOW_BEHIND = 70;
  const WINDOW_AHEAD = 110;
  const WINDOW = WINDOW_BEHIND + WINDOW_AHEAD;   // the span pool, 180 wide
  const SCROLL_K = 14;      // spring constants: scroll tracks tightly,
  const CARET_K = 9;        // the caret lags a little, deliberately

  // ---------------------------------------------------------------------------
  // Why the spans are a ring buffer at absolute positions.
  //
  // Two earlier arrangements both made the run go choppy, and both are recorded
  // here so neither comes back.
  //
  // 1. `first = cursor - WINDOW_BEHIND`, span `i` holding character `first + i`.
  //    The scroll target `-(cursor - first) * cw` is then a CONSTANT, so past
  //    character 70 the springs settled to zero error and the text stopped
  //    sliding altogether - it advanced by swapping glyph contents, one whole
  //    character per keystroke. Character-quantised scrolling is literally what
  //    choppiness is, and it began about four seconds in at 200 wpm. It also
  //    rewrote all 180 spans and all 180 caret twins on every frame the cursor
  //    moved: 360 text-node writes a frame.
  //
  // 2. Quantising `first` to a multiple of 24. That restored the sliding and cut
  //    the MEAN write rate by 24x, but it moved the cost into a burst: every 24
  //    characters the whole window was rewritten at once. Measured, that is a
  //    433-write frame against a 45-write mean - a 10x spike roughly every two
  //    seconds at 120 wpm, which is a periodic hitch rather than a smooth run.
  //
  // So: a span's slot is `idx % WINDOW` and its `left` is `idx * charWidth`,
  // both fixed for the life of that character. A character entering the window
  // writes one span and nothing else touches the DOM. There is no rebase, so
  // there is no burst, and the write rate is flat at about one per keystroke for
  // the whole run however long it goes.
  //
  // Positions grow without bound (a 10-minute run at 200 wpm reaches ~177,000px)
  // which is comfortably inside float precision, so no origin shifting is needed.
  // ---------------------------------------------------------------------------

  // The caret twin. Each keystroke lights the characters just ahead of the caret
  // and the glow decays, so sustained typing keeps the page lit and stopping lets
  // it go out. This is deliberately PRESENTATION ONLY: it is added on top of the
  // opacity the survival model computed and never feeds back into `isBlind`, so
  // it cannot change who lives or dies. PULSE_MAX is kept under the 0.18
  // legibility threshold so a genuinely dark character can never be lit into a
  // readable one - the race it creates is real, not cosmetic relief from it.
  const PULSE_GAIN = 0.5;    // added to the pulse per character typed
  const PULSE_TAU = 0.26;    // seconds to decay by 1/e
  const PULSE_MAX = 0.12;    // most opacity a keystroke can lend
  const PULSE_REACH = 12;    // characters ahead that it reaches

  const TWIN_BEHIND = 4;     // characters of twin kept left of the caret
  const TWIN_SPAN = 14;      // total characters in the twin string

  function createRenderer(els) {
    const st = {
      charWidth: 0,
      x: 0, caretX: 0,         // continuous floats, never character indices
      spans: [],
      pulse: 0,
      lastCursor: -1,
      twinFirst: -1,
      twinText: null
    };

    function measure() {
      const probe = document.createElement('span');
      probe.textContent = 'mmmmmmmmmm';
      probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;line-height:1';
      const cs = getComputedStyle(els.line);
      probe.style.font = cs.font;
      probe.style.fontSize = cs.fontSize;
      probe.style.fontFamily = cs.fontFamily;
      probe.style.letterSpacing = cs.letterSpacing;
      document.body.appendChild(probe);
      st.charWidth = probe.getBoundingClientRect().width / 10;
      probe.remove();

      // Absolutely positioned children give the line no height of its own, which
      // would break the `translateY(-50%)` that centres it. Pin it to one line.
      els.line.style.height = cs.fontSize;

      // every span's left is charWidth-derived, so they all have to be re-placed
      for (const sp of st.spans) sp.__idx = -1;
      return st.charWidth;
    }

    function build() {
      while (st.spans.length < WINDOW) {
        const sp = document.createElement('span');
        sp.style.position = 'absolute';
        sp.style.top = '0';
        sp.__idx = -1;
        sp.__cls = null;
        sp.__op = null;
        els.line.appendChild(sp);
        st.spans.push(sp);
      }
    }

    function draw(run, draft, dt) {
      if (!st.charWidth) measure();
      build();
      const cw = st.charWidth;
      const cursor = run.cursor;

      // --- the typing pulse ---------------------------------------------------
      if (st.lastCursor >= 0 && cursor > st.lastCursor) {
        st.pulse = Math.min(1, st.pulse + PULSE_GAIN * (cursor - st.lastCursor));
      }
      st.lastCursor = cursor;
      if (st.pulse > 0) {
        st.pulse *= Math.exp(-dt / PULSE_TAU);
        if (st.pulse < 0.002) st.pulse = 0;
      }

      const first = Math.max(0, cursor - WINDOW_BEHIND);
      const last = Math.min(run.text.length, first + WINDOW);
      const isC = run.draft === 'c';

      for (let idx = first; idx < first + WINDOW; idx++) {
        const span = st.spans[idx % WINDOW];

        // This slot is being recycled for a new character: the only moment it
        // needs its text and its position written.
        if (span.__idx !== idx) {
          span.__idx = idx;
          span.textContent = idx < last ? run.text[idx] : '';
          span.style.left = (idx * cw).toFixed(1) + 'px';
          span.__cls = null;
          span.__op = null;
        } else if (idx < last && span.textContent === '') {
          // the text caught up to a slot we blanked earlier (draft C commits its
          // branch text only once you choose a line)
          span.textContent = run.text[idx];
        }

        if (idx >= last) {
          if (span.__cls !== '') { span.className = ''; span.__cls = ''; }
          if (span.__op !== '') { span.style.opacity = ''; span.__op = ''; }
          continue;
        }

        let cls = '';
        let op = 1;

        if (idx < cursor) {
          const mark = run.marks[idx];
          cls = mark === 'err' ? 'err' : mark === 'miss' ? 'miss' : 'done';
        } else {
          const d = idx - cursor;
          op = draft.inkAhead(run, d);
          if (st.pulse > 0 && d < PULSE_REACH) {
            op = Math.min(1, op + PULSE_MAX * st.pulse * (1 - d / PULSE_REACH));
          }
        }

        // draft C: the edge has consumed everything behind it
        if (isC && idx < run.edge) { op = 0; cls = 'miss'; }

        if (span.__cls !== cls) { span.className = cls; span.__cls = cls; }
        const o = op >= 1 ? '' : op.toFixed(3);
        if (span.__op !== o) { span.style.opacity = o; span.__op = o; }
      }

      // --- springs: continuous float positions ---------------------------------
      const target = -cursor * cw;
      st.x += (target - st.x) * (1 - Math.exp(-SCROLL_K * dt));
      st.caretX += (target - st.caretX) * (1 - Math.exp(-CARET_K * dt));

      els.line.style.transform = 'translate(' + st.x.toFixed(2) + 'px, -50%)';
      els.caret.style.transform = 'translateX(' + (st.caretX - target).toFixed(2) + 'px)';

      // --- the caret twin ------------------------------------------------------
      // Only one character is ever visible through the caret's 1ch window, so the
      // twin is a short substring rather than a second 180-span line. That alone
      // removed half of the old per-frame write load. It stays registered with the
      // MAIN line, not with the caret, so the block reads as a window onto the
      // text rather than a box carrying a glyph around.
      const twinFirst = Math.max(0, cursor - TWIN_BEHIND);
      if (twinFirst !== st.twinFirst || st.twinText === null) {
        st.twinFirst = twinFirst;
        st.twinText = run.text.substr(twinFirst, TWIN_SPAN);
        els.caretLine.textContent = st.twinText;
      }
      const twinShift = (twinFirst - cursor) * cw + (st.x - st.caretX);
      els.caretLine.style.transform = 'translate(' + twinShift.toFixed(2) + 'px, -50%)';

      return { charWidth: cw, first: first, scrollX: st.x, caretOffset: st.caretX - target };
    }

    function reset() {
      st.x = 0; st.caretX = 0;
      st.pulse = 0; st.lastCursor = -1;
      st.twinFirst = -1; st.twinText = null;
      for (const sp of st.spans) {
        sp.__idx = -1; sp.__cls = null; sp.__op = null;
        sp.textContent = ''; sp.className = ''; sp.style.opacity = '';
      }
      els.caretLine.textContent = '';
    }

    return {
      measure: measure, draw: draw, reset: reset,
      get charWidth() { return st.charWidth; }

<script>
/* src/screens.js */
(function (root) {
  'use strict';

  const req = (typeof require !== 'undefined' && typeof module !== 'undefined');
  const g = req ? require('./generator.js') : root.cadence;

  const KEY = 'cadence.v2';
  const DRAFT_IDS = ['a', 'c'];

  function blank() {
    const r = { v: 2 };
    for (const id of DRAFT_IDS) r[id] = { longest: null, highest: null };
    return r;
  }

  function validRecord(r) {
    return r && typeof r === 'object' && typeof r.ms === 'number' && typeof r.score === 'number';
  }

  function loadRecords() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return blank(); }
    if (!raw) return blank();
    let parsed;
    try { parsed = JSON.parse(raw); } catch (e) { return blank(); }
    const out = blank();
    for (const id of DRAFT_IDS) {
      const d = parsed && parsed[id];
      if (d && validRecord(d.longest)) out[id].longest = d.longest;
      if (d && validRecord(d.highest)) out[id].highest = d.highest;
    }
    return out;
  }

  function saveRecords(recs) {
    try { localStorage.setItem(KEY, JSON.stringify(recs)); } catch (e) { /* ignore */ }
  }

  function summarise(run) {
    return {
      ms: typeof run.ms === 'number' ? run.ms : 0,
      score: Math.round(run.score || 0),
      wpm: Math.round(run.wpm || 0),
      peak: Math.round(run.peakV || 0),
      rhythm: Math.round(run.rhythm || 0),
      chapterIndex: run.chapterIndex || 0,
      accuracy: run.total ? (100 * run.correct / run.total) : 0
    };
  }

  function recordRun(draftId, run) {
    const s = summarise(run);
    const recs = loadRecords();
    const slot = recs[draftId];
    const fell = {
      longest: !slot.longest || s.ms > slot.longest.ms,
      highest: !slot.highest || s.score > slot.highest.score
    };
    if (fell.longest) slot.longest = s;
    if (fell.highest) slot.highest = s;
    if (fell.longest || fell.highest) saveRecords(recs);
    return fell;
  }

  function formatDuration(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
  }

  function scoreLine(draftId, draftName, run) {
    const s = summarise(run);
    return 'cadence ' + draftId + ' (' + draftName + ') · ' + formatDuration(s.ms) +
      ' · ' + s.score.toLocaleString('en-US') + ' · ' + s.wpm + 'wpm · r' + s.rhythm +
      ' · chapter ' + (s.chapterIndex + 1);
  }

  // rhythm as ink weight: the page remembers how you typed it, not just what
  function inkTrace(run, count) {
    const end = run.cursor;
    const start = Math.max(0, end - count);
    const out = [];
    for (let i = start; i < end; i++) {
      const r = run.rhythmAt[i] === undefined ? 50 : run.rhythmAt[i];
      out.push({
        ch: run.text[i],
        opacity: 0.18 + 0.82 * Math.pow(r / 100, 1.9),
        weight: r > 72 ? 500 : 400,
        err: run.marks[i] === 'err',
        miss: run.marks[i] === 'miss'
      });
    }
    return out;
  }

  function renderPage(run, count) {
    let html = '';
    for (const c of inkTrace(run, count)) {
      const colour = (c.err || c.miss) ? 'var(--red)' : 'var(--ink)';
      const op = c.miss ? 0.2 : c.opacity;
      html += '<span style="opacity:' + op.toFixed(3) + ';font-weight:' + c.weight +
        ';color:' + colour + '">' + c.ch + '</span>';
    }
    return html;
  }

  // ---------------------------------------------------------------------------
  // The result screen: minimal by default.
  //
  // What stays visible is what you want in the first half second after a run
  // ends - how long you lasted, what you scored, and whether that beat you. Every
  // other number is a thing you go and look at, so it lives behind one control in
  // the hint row, phrased like the other hints rather than built as a button.
  //
  // shell.js owns the markup written into #result-sheet and cannot be edited from
  // here, so this restructures what it finds instead of replacing it: the stats
  // row and the ink reprint are moved into a .more wrapper that CSS hides until
  // the sheet carries .is-open. Idempotent - re-running it on an already-enhanced
  // sheet is a no-op, which is what makes it safe to drive from a MutationObserver.
  // ---------------------------------------------------------------------------

  const DETAIL_PARTS = ['.stats', '#page-print'];

  function resultOpen(sheet) {
    return !!sheet && sheet.className.indexOf('is-open') >= 0;
  }

  function setResultOpen(sheet, open) {
    if (!sheet) return false;
    sheet.classList[open ? 'add' : 'remove']('is-open');
    const ctl = sheet.querySelector('.expand');
    // The label names what the control will do next, not what state you are in.
    if (ctl) ctl.innerHTML = '<b>' + (open ? '&#8593;' : '&#8595;') + '</b> ' +
      (open ? 'hide stats' : 'all stats');
    return !!open;
  }

  function enhanceResult(sheet) {
    if (!sheet || sheet.querySelector('.expand')) return null;
    const hint = sheet.querySelector('.hint');
    if (!hint) return null;

    const more = document.createElement('div');
    more.className = 'more';
    for (const sel of DETAIL_PARTS) {
      const el = sheet.querySelector(sel);
      if (el) more.appendChild(el);          // appendChild moves, it does not copy
    }
    sheet.insertBefore(more, hint);

    const ctl = document.createElement('span');
    ctl.className = 'expand';
    ctl.setAttribute('role', 'button');
    ctl.tabIndex = 0;
    hint.insertBefore(ctl, hint.firstChild);
    ctl.addEventListener('click', () => setResultOpen(sheet, !resultOpen(sheet)));

    setResultOpen(sheet, false);             // every run starts collapsed
    return ctl;
  }

  // ---------------------------------------------------------------------------
  // Theme. The palette is CSS custom properties on :root, so the whole of dark
  // mode is one attribute on <html>. resolveTheme is kept pure and separate so
  // the first-visit rule can be tested without a browser; the identical two lines
  // are also inlined in <head> so the choice lands before the first paint.
  // ---------------------------------------------------------------------------

  const THEME_KEY = 'cadence.theme';

  function resolveTheme(stored, prefersDark) {
    if (stored === 'light' || stored === 'dark') return stored;
    return prefersDark ? 'dark' : 'light';
  }

  function storedTheme() {
    try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
  }

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    const v = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', v);
    try { localStorage.setItem(THEME_KEY, v); } catch (e) { /* private mode */ }
    return v;
  }

  function toggleTheme() {
    return applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
  }

  const api = {
    KEY, DRAFT_IDS, loadRecords, saveRecords, recordRun, summarise,
    formatDuration, scoreLine, inkTrace, renderPage,
    enhanceResult, setResultOpen, resultOpen,
    THEME_KEY, resolveTheme, storedTheme, currentTheme, applyTheme, toggleTheme
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.cadenceScreens = Object.assign(root.cadenceScreens || {}, api);
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* src/shell.js */
(function (root) {
  'use strict';

  const c = root.cadence;
  const S = root.cadenceScreens;

  const DRAFTS = { a: c.draftA, c: c.draftC };
  const ORDER = ['a', 'c'];
  const CHAPTER_WORDS = ['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight'];
  const STRIKE_LABEL = { a: 'strikes', c: 'touches' };
  // Draft C's pressure comes from behind, so its caret sits further right to leave
  // room for the edge. A and B show the page ahead, so theirs sits left.
  const CARET_X = { a: 0.34, c: 0.62 };

  // ---------------------------------------------------------------------------
  // The goal ladder - draft A.
  //
  // Draft A paces the drying ink against a goal wpm the player picked, so the goal
  // has to be chosen before the run and remembered between them. Cleared rungs live
  // under their own localStorage key rather than in cadenceScreens' records: that
  // module owns per-draft bests and its schema is not mine to change, and this is a
  // different kind of thing anyway - progression rather than a record.
  // ---------------------------------------------------------------------------

  const LEVELS = c.LEVELS;
  const GOAL_KEY = 'cadence.goal.v1';
  const CUSTOM_STEP = 5;              // shift+arrow sets a goal off the ladder

  function loadGoalState() {
    const blank = { goal: LEVELS[0], cleared: [], best: null };
    let raw = null;
    try { raw = localStorage.getItem(GOAL_KEY); } catch (e) { return blank; }
    if (!raw) return blank;
    let p;
    try { p = JSON.parse(raw); } catch (e) { return blank; }
    if (!p || typeof p !== 'object') return blank;
    return {
      goal: typeof p.goal === 'number' && p.goal > 0 ? Math.round(p.goal) : blank.goal,
      cleared: Array.isArray(p.cleared) ? p.cleared.filter(n => typeof n === 'number') : [],
      best: p.best && typeof p.best.goal === 'number' ? p.best : null
    };
  }

  function saveGoalState() {
    try { localStorage.setItem(GOAL_KEY, JSON.stringify(app.goals)); } catch (e) { /* ignore */ }
  }

  // every goal the run held for ten seconds counts as cleared, ladder rung or not
  function bankGoals(run) {
    const reached = c.draftA.reachedOf(run);
    if (!reached.length) return false;
    let changed = false;
    for (const r of reached) {
      if (app.goals.cleared.indexOf(r.goal) < 0) { app.goals.cleared.push(r.goal); changed = true; }
    }
    const top = reached[reached.length - 1];
    if (!app.goals.best || top.goal > app.goals.best.goal) {
      app.goals.best = { goal: top.goal, ms: top.ms };
      changed = true;
    }
    if (changed) { app.goals.cleared.sort((a, b) => a - b); saveGoalState(); }
    return changed;
  }

  function setGoal(goal) {
    app.goals.goal = Math.max(20, Math.min(400, Math.round(goal)));
    saveGoalState();
    renderLevels();
  }

  function stepGoal(dir, fine) {
    const g = app.goals.goal;
    if (fine) return setGoal(g + dir * CUSTOM_STEP);
    if (dir > 0) return setGoal(c.nextGoal(g));
    let prev = LEVELS[0];
    for (const l of LEVELS) if (l < g) prev = l;
    setGoal(prev);
  }

  function renderLevels() {
    const g = app.goals.goal;
    const rungs = LEVELS.slice();
    if (rungs.indexOf(g) < 0) rungs.push(g);          // a custom goal shows as a rung
    rungs.sort((a, b) => a - b);
    els['level-list'].innerHTML = rungs.map(l =>
      '<span class="rung' + (l === g ? ' sel' : '') +
      (app.goals.cleared.indexOf(l) >= 0 ? ' cleared' : '') +
      '" data-goal="' + l + '">' + l + '</span>').join(' ');
    for (const r of els['level-list'].children) {
      r.addEventListener('click', () => setGoal(Number(r.dataset.goal)));
    }
    const best = app.goals.best;
    els['goal-note'].innerHTML = best
      ? 'best reached <b>' + best.goal + '</b> in ' + (best.ms / 1000).toFixed(0) + 's'
      : 'hold the goal for ten seconds to reach it';
    // the ladder is draft A's pacer; draft C paces itself off your own speed
    els['goal-row'].style.display = app.draftId === 'a' ? 'flex' : 'none';
  }

  const els = {};
  const app = { draftId: 'a', run: null, renderer: null, rail: null, screen: 'title', last: 0,
    goals: null };

  function grab() {
    const ids = ['screen-title', 'screen-run', 'screen-result', 'draft-list',
      'goal-row', 'level-list', 'goal-note', 'hud-goal', 'hud-goal-label', 'hud-goal-wrap',
      'hud-score', 'hud-wpm', 'hud-demand', 'hud-rhythm', 'hud-chapter', 'hud-chapter-label',
      'strikes', 'strike-label', 'stage', 'track', 'line', 'caret', 'caret-line',
      'edge', 'branch-safe', 'branch-greedy', 'rail',
      'bar-fill', 'bar-notch', 'result-sheet'];
    for (const id of ids) els[id] = document.getElementById(id);
  }

  function show(name) {
    app.screen = name;
    for (const n of ['title', 'run', 'result']) {
      els['screen-' + n].className = 'screen' + (n === name ? ' is-active' : '');
    }
  }

  // ---------------- title ----------------

  function renderTitle() {
    const recs = S.loadRecords();
    els['draft-list'].innerHTML = ORDER.map((id, i) => {
      const D = DRAFTS[id];
      const r = recs[id];
      const best = r.highest
        ? r.highest.score.toLocaleString('en-US') + ' <em>&middot; ' + S.formatDuration(r.longest.ms) + '</em>'
        : '<em>—</em>';
      return '<div class="draft-row' + (id === app.draftId ? ' sel' : '') + '" data-id="' + id + '">' +
        '<span class="k">' + (i + 1) + '</span>' +
        '<span class="n">' + D.META.name + '</span>' +
        '<span class="d">' + D.META.blurb + '</span>' +
        '<span class="b">' + best + '</span></div>';
    }).join('');
    for (const row of els['draft-list'].children) {
      row.addEventListener('click', () => { app.draftId = row.dataset.id; renderTitle(); startRun(); });
    }
    renderLevels();
  }

  // ---------------- run ----------------

  function startRun() {
    app.run = DRAFTS[app.draftId].createRun((Math.random() * 0x7fffffff) | 0,
      { goal: app.goals.goal });
    app.renderer.reset();
    app.rail.reset();
    app.last = performance.now();
    applyCaretX(app.draftId);
    els['strike-label'].textContent = STRIKE_LABEL[app.draftId];
    els['edge'].style.display = app.draftId === 'c' ? 'block' : 'none';
    const showBranch = app.draftId === 'c' ? 'block' : 'none';
    els['branch-safe'].style.display = showBranch;
    els['branch-greedy'].style.display = showBranch;
    els['hud-goal-wrap'].style.display = app.draftId === 'a' ? 'block' : 'none';
    show('run');
    app.rail.resize();            // the canvas is only measurable once visible
    app.renderer.measure();
  }

  function finishRun() {
    const run = app.run;
    if (run.draft === 'a') bankGoals(run);
    run.ms = c.elapsedMs(run);
    run.wpm = run.ms ? (run.correct / 5) / (run.ms / 60000) : 0;
    showResult(run);
    // Split the sheet into its minimal and expanded halves straight away. This
    // used to be driven by a MutationObserver because the file was owned
    // elsewhere; a direct call is synchronous with the render instead of a
    // microtask behind it, so the sheet is never briefly shown fully expanded.
    if (root.cadenceScreens.enhanceResult) root.cadenceScreens.enhanceResult(els['result-sheet']);
    show('result');
  }

  // Reading the stage's geometry every frame forces a synchronous layout, and it
  // lands right after the renderer has dirtied its span window. The width only
  // changes on resize and on a font load, both of which already call remeasure().
  let stageWidth = 0;
  function invalidateStageWidth() { stageWidth = 0; }
  function caretScreenX() {
    if (!stageWidth) stageWidth = els['stage'].getBoundingClientRect().width;
    return stageWidth * CARET_X[app.draftId];
  }

  function applyCaretX(draftId) {
    document.documentElement.style.setProperty('--caret-x', (CARET_X[draftId] * 100) + '%');
    invalidateStageWidth();
  }

  function drawOverlays(run, info, now) {
    const cw = info.charWidth;
    const baseX = caretScreenX() + info.caretOffset;


    if (run.draft === 'c') {
      const edgeX = baseX + (run.edge - run.cursor) * cw;
      els['edge'].style.left = Math.max(-40, edgeX).toFixed(1) + 'px';

      // The fork, drawn AT the junction rather than at the caret.
      //
      // The junction is open a whole segment early (see draft-c.js newBranch) and
      // the safe line is already on the page as a provisional continuation, so the
      // main line carries it inline and needs no overlay: what the overlay has to
      // show is the line you would have to reach for. Drawing it at the junction's
      // own x - not at the caret - is what lets you read it while you finish the
      // current segment, which is the whole fix. #branch-safe carries the x1 tag,
      // so the fork point is marked on the line you are on as well.
      const b = run.branch;
      if (b && b.committed === null) {
        const forkX = baseX + (b.at - run.cursor) * cw;
        els['branch-safe'].style.left = forkX.toFixed(1) + 'px';
        els['branch-greedy'].style.left = forkX.toFixed(1) + 'px';
        if (els['branch-greedy'].dataset.at !== String(b.at)) {
          els['branch-greedy'].dataset.at = String(b.at);
          els['branch-safe'].innerHTML = '<span class="tag">&times;1</span>';
          els['branch-greedy'].innerHTML = b.greedyText +
            '<span class="tag">  &times;' + DRAFTS.c.TUNING.greedyPayout + '  edge faster</span>';
        }
        // the closer the junction, the stronger the fork reads
        const away = Math.max(0, b.at - run.cursor);
        const near = Math.max(0.35, Math.min(1, 1.15 - away / 40));
        els['branch-safe'].style.opacity = near.toFixed(2);
        els['branch-greedy'].style.opacity = near.toFixed(2);
      } else {
        els['branch-safe'].style.opacity = '0';
        els['branch-greedy'].style.opacity = '0';
      }
    }
  }

  function updateHud(run) {
    const D = DRAFTS[app.draftId];
    els['hud-score'].textContent = Math.round(run.score).toLocaleString('en-US');
    els['hud-wpm'].textContent = Math.round(run.v);
    els['hud-demand'].textContent = Math.round(run.demand.value);
    els['hud-rhythm'].textContent = Math.round(run.rhythm);

    if (run.draft === 'a') {
      // the goal, and how much of the ten-second hold is banked. the label carries
      // the progress rather than a second meter: a bar for a number this small is
      // more furniture than information.
      const held = run.demand.atGoalMs / 1000;
      const cleared = run.demand.reached.length;
      els['hud-goal'].textContent = Math.round(run.demand.goal);
      const label = held >= 0.4
        ? 'holding ' + held.toFixed(0) + '/' + c.HOLD_SECONDS
        : (cleared ? cleared + ' cleared' : 'goal');
      if (els['hud-goal-label'].textContent !== label) els['hud-goal-label'].textContent = label;
    }

    const ch = c.CHAPTERS[run.chapterIndex];
    els['hud-chapter'].textContent = ch.name;
    els['hud-chapter-label'].textContent = 'chapter ' + CHAPTER_WORDS[run.chapterIndex];

    const spent = D.strikesOf(run);
    const marks = els['strikes'].children;
    for (let i = 0; i < marks.length; i++) {
      const cls = i < spent ? 'spent' : '';
      if (marks[i].className !== cls) marks[i].className = cls;
    }

    const scale = 220;
    els['bar-fill'].style.width = Math.min(100, (run.v / scale) * 100).toFixed(1) + '%';
    els['bar-notch'].style.left = Math.min(100, (run.demand.value / scale) * 100).toFixed(1) + '%';
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - app.last) / 1000);
    app.last = now;
    if (app.screen !== 'run' || !app.run) return;

    const D = DRAFTS[app.draftId];
    D.tick(app.run, now, dt);
    const info = app.renderer.draw(app.run, D, dt);
    drawOverlays(app.run, info, now);
    app.rail.draw(now, app.run.rhythm);
    updateHud(app.run);

    if (app.run.ended) finishRun();
  }

  // ---------------- result ----------------

  function showResult(run) {
    const D = DRAFTS[app.draftId];
    const s = S.summarise(run);
    const fell = S.recordRun(app.draftId, run);
    const chapter = c.CHAPTERS[s.chapterIndex];

    const reached = run.draft === 'a' ? c.draftA.reachedOf(run) : [];
    const extra = run.draft === 'c'
      ? stat('safe', run.safeTaken) + stat('greedy', run.greedyTaken)
      : stat('goal', reached.length ? reached[reached.length - 1].goal : run.demand.startGoal,
          reached.length ? ' reached' : ' missed') +
        stat('best combo', run.maxCombo);

    els['result-sheet'].innerHTML =
      '<div class="wordmark">' + D.META.name + '<s> &middot; ' + D.endLabel(run) + '</s></div>' +
      '<div class="big">' + S.formatDuration(s.ms) + '</div>' +
      '<div class="sub">' + s.score.toLocaleString('en-US') + '</div>' +
      (fell.longest || fell.highest ? '<div class="flag">new record</div>' : '') +
      '<div class="stats">' +
        stat('wpm', s.wpm) + stat('peak', s.peak) +
        stat('rhythm', s.rhythm, '%') + stat('accuracy', s.accuracy.toFixed(1), '%') +
        extra + stat('reached', chapter.name) +
      '</div>' +
      '<div id="page-print">' + S.renderPage(run, 260) + '</div>' +
      '<div class="hint"><span><b>tab</b> again</span><span><b>c</b> copy</span>' +
      '<span><b>esc</b> drafts</span></div>';

    function stat(k, v, unit) {
      return '<div><i class="label">' + k + '</i><div class="v">' + v +
        (unit ? '<s>' + unit + '</s>' : '') + '</div></div>';
    }
  }

  // ---------------- input ----------------

  function isTypingKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return false;
    return e.key === ' ' || /^[a-z]$/.test(e.key);
  }

  function onKeyDown(e) {
    const now = performance.now();              // timestamp before any other work

    if (e.key === 'Tab') { e.preventDefault(); startRun(); return; }
    if (e.key === 'Escape') { renderTitle(); show('title'); return; }

    // The goal ladder: left and right, on the title screen only. Deliberately not
    // up and down, and deliberately not on the result screen - index.html binds the
    // vertical arrows there to the stats panel, and two handlers fighting over one
    // key is how a screen ends up doing two things at once.
    if (app.screen === 'title' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      e.preventDefault();
      if (app.draftId !== 'a') return;         // the ladder is draft A's alone
      stepGoal(e.key === 'ArrowRight' ? 1 : -1, e.shiftKey);
      return;
    }

    if (app.screen !== 'run' && /^[12]$/.test(e.key)) {
      app.draftId = ORDER[Number(e.key) - 1];
      renderTitle();
      if (app.screen === 'result') show('title');
      return;
    }

    if (app.screen === 'result' && (e.key === 'c' || e.key === 'C')) {
      const line = S.scoreLine(app.draftId, DRAFTS[app.draftId].META.name, app.run);
      if (navigator.clipboard) navigator.clipboard.writeText(line).catch(() => {});
      return;
    }

    if (e.key === ' ') e.preventDefault();
    if (!isTypingKey(e)) return;

    if (app.screen !== 'run') { startRun(); app.last = now; }

    const res = DRAFTS[app.draftId].onKey(app.run, e.key, now);
    app.rail.mark(now);
    if (res.ended) finishRun();
  }

  function boot() {
    grab();
    app.goals = loadGoalState();
    app.renderer = c.createRenderer({
      line: els['line'], caret: els['caret'], caretLine: els['caret-line'], track: els['track']
    });
    app.rail = c.createRail(els['rail']);

    const remeasure = () => { invalidateStageWidth(); app.renderer.measure(); app.rail.resize(); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(remeasure);
    window.addEventListener('resize', remeasure);
    window.addEventListener('keydown', onKeyDown);

    renderTitle();
    show('title');
    requestAnimationFrame(frame);
  }

  // Replays a scripted run with synthetic timestamps and renders a single frame.
  // Deterministic: it never waits on rAF or setTimeout, both of which a browser
  // throttles hard in a background tab. Used to preview a draft at a chosen point
  // in its difficulty curve, and to verify rendering without racing the clock.
  function replay(draftId, opts) {
    const o = Object.assign({ keys: 120, msPerKey: 70, jitter: 0, errorEvery: 0, seed: 1,
      goal: 100 }, opts || {});
    const D = DRAFTS[draftId];
    if (!app.goals) app.goals = loadGoalState();
    app.draftId = draftId;
    app.screen = 'replay';                     // keeps frame() from clobbering us
    app.run = D.createRun(o.seed, { goal: o.goal });
    app.renderer.reset();
    app.rail.reset();

    applyCaretX(draftId);
    els['strike-label'].textContent = STRIKE_LABEL[draftId];
    els['edge'].style.display = draftId === 'c' ? 'block' : 'none';
    const vis = draftId === 'c' ? 'block' : 'none';
    els['branch-safe'].style.display = vis;
    els['branch-greedy'].style.display = vis;
    els['hud-goal-wrap'].style.display = draftId === 'a' ? 'block' : 'none';
    show('run');                  // before any drawing: a hidden canvas measures 0
    app.rail.resize();
    app.renderer.measure();

    let now = 1000;
    let seed = o.seed;
    const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

    for (let i = 0; i < o.keys && !app.run.ended; i++) {
      const run = app.run;
      let ch;
      if (draftId === 'c' && D.atJunction(run)) {
        ch = (o.greedy ? run.branch.greedyText : run.branch.safeText)[0];
      } else {
        ch = run.text[run.cursor];
      }
      if (ch === undefined) ch = ' ';
      const wrong = o.errorEvery && i > 0 && i % o.errorEvery === 0;
      D.onKey(run, wrong ? (ch === 'q' ? 'z' : 'q') : ch, now);
      app.rail.mark(now);
      const step = o.msPerKey * (1 + (rnd() * 2 - 1) * o.jitter);
      // advance the world in frame-sized slices so springs and demand settle
      for (let acc = 0; acc < step; acc += 16) {
        const slice = Math.min(16, step - acc) / 1000;
        D.tick(run, now + acc, slice);
        app.renderer.draw(run, D, slice);
      }
      now += step;
    }

    const run = app.run;
    const info = app.renderer.draw(run, D, 1 / 60);
    drawOverlays(run, info, now);
    app.rail.draw(now, run.rhythm);
    updateHud(run);
    app.screen = 'replay';

    return {
      draft: draftId, cursor: run.cursor, score: Math.round(run.score),
      wpm: Math.round(run.v), demand: +run.demand.value.toFixed(1),
      ratio: +run.ratio.toFixed(2), rhythm: run.rhythm,
      goal: run.demand.goal, reached: run.draft === 'a' ? run.demand.reached.length : 0,
      strikes: D.strikesOf(run), ended: run.ended, reason: run.endReason,
      chapter: c.CHAPTERS[run.chapterIndex].name,
      caretOffsetPx: +info.caretOffset.toFixed(1), charWidth: +info.charWidth.toFixed(2)
    };
  }

  root.cadenceApp = { app: app, els: els, startRun: startRun, finishRun: finishRun,
    boot: boot, DRAFTS: DRAFTS, replay: replay, show: show, renderTitle: renderTitle };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
// Wiring that belongs to index.html because shell.js owns the keyboard and the
// result markup and is edited elsewhere. Nothing here needs shell.js to change.
(function () {
  var S = window.cadenceScreens;
  var sheet = document.getElementById('result-sheet');
  var resultScreen = document.getElementById('screen-result');
  var label = document.getElementById('theme-label');
  var toggle = document.getElementById('theme-toggle');
  if (!S) return;

  // shell.js calls S.enhanceResult itself at the end of every run; this only has
  // to cover a sheet that is already on the page when the script loads.
  if (sheet) S.enhanceResult(sheet);

  function afterTheme() {
    // The canvas cannot inherit a custom property, so it re-reads them on demand.
    var app = window.cadenceApp && window.cadenceApp.app;
    if (app && app.rail) app.rail.readColours();
    if (label) label.textContent = S.currentTheme() === 'dark' ? 'light' : 'dark';
  }
  afterTheme();

  if (toggle) toggle.addEventListener('click', function () { S.toggleTheme(); afterTheme(); });

  // shift+t and the arrows, chosen because shell.js treats every plain lowercase
  // letter and space as "start typing" and already owns tab, esc, 1, 2 and c.
  // e.key for shift+t is 'T', which fails its /^[a-z]$/ test, so it is free
  // everywhere - including mid-run, where it must not interrupt the run.
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'T') { S.toggleTheme(); afterTheme(); return; }
    if (!sheet || !resultScreen || resultScreen.className.indexOf('is-active') < 0) return;
    if (e.key === 'ArrowDown') S.setResultOpen(sheet, true);
    else if (e.key === 'ArrowUp') S.setResultOpen(sheet, false);
  });
})();
</script>
